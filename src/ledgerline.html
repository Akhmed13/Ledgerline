<title>Ledgerline Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark brass-trimmed rail on the left (top bar on phones); main column switches between dashboard, trade log, trade detail, playbooks and daily journal */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f5f6f8; --ink:#141820; --muted:#5b6474; --line:#dce0e6;
  --accent:#a86c12; --accent-ink:#ffffff; --accent-soft:#f5e8d2;
  --gain:#1b7f52; --gain-bg:#e1f2e8; --gain-line:#a7d8bd;
  --loss:#bf3a33; --loss-bg:#fbe6e4; --loss-line:#efb1ab;
  --flat:#8a93a2; --star:#e0a12c;
  --c-amber:#b7791f; --c-blue:#3b6fd4; --c-green:#2f8f5b; --c-pink:#c24584; --c-violet:#7a55c7; --c-slate:#5b6474; --c-red:#c43d3d; --c-orange:#cf6519; --c-yellow:#a98608; --c-lime:#5a931c; --c-teal:#178a81; --c-cyan:#1a86a8; --c-indigo:#4b52c2; --c-purple:#9043b3; --c-rose:#c2416a; --c-brown:#8a5a3c;
  --rail:#161a21; --rail-ink:#d3d8e1; --rail-muted:#7f8796; --rail-hover:#222833;
  --shadow:0 1px 2px rgba(20,24,32,.06),0 4px 14px rgba(20,24,32,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1017; --surface:#181922; --surface-2:#20212c; --ink:#ededf4; --muted:#9b9db3; --line:#2b2c3a;
  --accent:#8b6cf6; --accent-ink:#ffffff; --accent-soft:#2b2450;
  --gain:#2fd18b; --gain-bg:#10291f; --gain-line:#1d5a41;
  --loss:#ff5d6e; --loss-bg:#2e151a; --loss-line:#6b2731;
  --flat:#78818f; --star:#f0b54a;
  --c-amber:#e0a548; --c-blue:#7aa2f0; --c-green:#5cc48c; --c-pink:#ea7fb5; --c-violet:#a88bea; --c-slate:#97a0af; --c-red:#f07a72; --c-orange:#f29a5c; --c-yellow:#e3c450; --c-lime:#a4d465; --c-teal:#4fc7bd; --c-cyan:#5cc3e3; --c-indigo:#8f95ef; --c-purple:#c08ae6; --c-rose:#ef8aa7; --c-brown:#c8997a;
  --rail:#13141c; --rail-ink:#dcdcea; --rail-muted:#7d7f96; --rail-hover:#22233a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1017; --surface:#181922; --surface-2:#20212c; --ink:#ededf4; --muted:#9b9db3; --line:#2b2c3a;
  --accent:#8b6cf6; --accent-ink:#ffffff; --accent-soft:#2b2450;
  --gain:#2fd18b; --gain-bg:#10291f; --gain-line:#1d5a41;
  --loss:#ff5d6e; --loss-bg:#2e151a; --loss-line:#6b2731;
  --flat:#78818f; --star:#f0b54a;
  --c-amber:#e0a548; --c-blue:#7aa2f0; --c-green:#5cc48c; --c-pink:#ea7fb5; --c-violet:#a88bea; --c-slate:#97a0af; --c-red:#f07a72; --c-orange:#f29a5c; --c-yellow:#e3c450; --c-lime:#a4d465; --c-teal:#4fc7bd; --c-cyan:#5cc3e3; --c-indigo:#8f95ef; --c-purple:#c08ae6; --c-rose:#ef8aa7; --c-brown:#c8997a;
  --rail:#13141c; --rail-ink:#dcdcea; --rail-muted:#7d7f96; --rail-hover:#22233a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gain{color:var(--gain)} .loss{color:var(--loss)} .flat{color:var(--flat)}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:22px;padding:22px 14px;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;color:#fff}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 12px;font-weight:600}
.add-btn:hover{filter:brightness(1.06)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-muted);padding:0 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--rail-ink);padding:9px 10px;border-radius:7px;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--rail-hover)}
.nav button[aria-current="page"]{background:var(--rail-hover);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-muted);padding:0 10px;line-height:1.5}

.main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;color:var(--muted);font-weight:500;font-size:13px;min-width:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:10px;padding:10px 14px;font-size:13px}
.banner button{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.chip{font-family:var(--f-num);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);letter-spacing:0;text-transform:none}
.hint{font-size:12px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi .big{font-family:var(--f-num);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.split span{display:block;height:100%}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend b{font-family:var(--f-num);font-weight:500}
.bars{display:flex;flex-direction:column;gap:5px}
.bars div{height:7px;border-radius:99px}
.streaks{display:flex;gap:14px}
.streak{display:flex;flex-direction:column;gap:2px}
.streak .big{font-size:20px}
.streak small{color:var(--muted);font-size:11.5px}
.spark svg{width:100%;height:36px;display:block}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cal-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0 6px;letter-spacing:-.01em;min-width:9.5ch}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:500}
.ghost:hover{border-color:var(--muted)}
.monthsum{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.pill{font-family:var(--f-num);font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.g{background:var(--gain-bg);border-color:var(--gain-line);color:var(--gain)}
.pill.l{background:var(--loss-bg);border-color:var(--loss-line);color:var(--loss)}

.cal-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(74px,1fr)) minmax(100px,1.1fr);gap:6px;min-width:660px}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.day{position:relative;min-height:88px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:6px 7px;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:1px;font-size:11px;color:var(--muted)}
button.day:hover{border-color:var(--muted)}
.day.out{background:transparent;border-style:dashed;opacity:.45}
.day.today .dnum{background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px}
.day .dnum{font-family:var(--f-num);font-size:11.5px;color:var(--muted);align-self:flex-end;margin-bottom:auto}
.day .dval{font-family:var(--f-num);font-weight:600;font-size:14.5px;color:var(--ink)}
.day .dmeta{font-family:var(--f-num);font-size:10.5px}
.day .dnote{position:absolute;left:7px;top:7px;color:var(--muted)}
.day.win{background:var(--gain-bg);border-color:var(--gain-line)}
.day.win .dval{color:var(--gain)}
.day.lose{background:var(--loss-bg);border-color:var(--loss-line)}
.day.lose .dval{color:var(--loss)}
.day.even .dval{color:var(--flat)}
.wk{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.wk small{font-size:11px;color:var(--muted)}
.wk .wval{font-family:var(--f-num);font-weight:600;font-size:15px}

.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .big{font-family:var(--f-num);font-size:24px;font-weight:600;letter-spacing:-.02em}
.balance-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.inline-edit{display:flex;gap:6px}
.inline-edit input{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface-2);font-family:var(--f-num)}
.linkish{background:none;border:0;color:var(--accent);font-weight:500;font-size:12.5px;padding:0}
.score-wrap{display:flex;justify-content:center}
.score-wrap svg{width:100%;max-width:260px;height:auto}
.score-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px;color:var(--muted)}
.score-total b{font-family:var(--f-num);font-size:22px;color:var(--ink)}
.eq svg{width:100%;height:auto;display:block}

/* trade log */
.log{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toolbar .left{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0;width:200px;max-width:100%}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
table.trades{min-width:1060px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.status{font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:5px;padding:2px 7px;border:1px solid}
.status.win{color:var(--gain);border-color:var(--gain-line);background:var(--gain-bg)}
.status.loss{color:var(--loss);border-color:var(--loss-line);background:var(--loss-bg)}
.status.be{color:var(--flat);border-color:var(--line);background:var(--surface-2)}
.side{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;border:1px solid var(--line)}
.rev{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--line);color:transparent;background:none;padding:0}
.rev.on{background:var(--gain);border-color:var(--gain);color:#fff}
.tagchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid color-mix(in srgb,var(--tc,var(--c-slate)) 40%,transparent);background:color-mix(in srgb,var(--tc,var(--c-slate)) 13%,transparent);color:var(--ink);white-space:nowrap}
.tagchip button{border:0;background:none;padding:0;color:var(--muted);font-size:12px;line-height:1}
.tags-cell{display:flex;gap:4px;flex-wrap:wrap;max-width:220px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.del{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);padding:5px 10px;font-size:12.5px;font-weight:500}
.del:hover{color:var(--loss);border-color:var(--loss-line)}
.del.armed{background:var(--loss);color:#fff;border-color:var(--loss)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);margin:0 0 6px;font-size:18px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* trade detail */
.tv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.tv-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tv-title h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.02em}
.tv-title .when{color:var(--muted);font-size:13px}
.tv{display:grid;grid-template-columns:370px minmax(0,1fr);gap:16px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 10px 9px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbody{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.netbig{border-left:3px solid var(--line);padding-left:12px}
.netbig .big{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.02em}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:6px 12px;align-items:center;font-size:13px}
.fields dt{color:var(--muted)}
.fields dd{margin:0;min-width:0;font-family:var(--f-num)}
.fields .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:6px 0}
.fin{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 8px;font-family:var(--f-num);font-size:13px;min-width:0}
select.fin{font-family:var(--f-body)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:0 1px;font-size:19px;line-height:1;color:var(--line)}
.stars button.on{color:var(--star)}
.scale{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--loss),var(--line) 50%,var(--gain))}
.scale i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.cat{display:flex;flex-direction:column;gap:6px}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.cat-head .dot{width:9px;height:9px;border-radius:50%;background:var(--tc);display:inline-block;margin-right:6px}
.tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 6px;min-height:34px;background:var(--surface-2);text-align:left;width:100%}
.tagbox .ph{color:var(--muted);font-size:12.5px;padding:0 4px}
.menu{border:1px solid var(--line);background:var(--surface);border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.15);padding:6px;display:flex;flex-direction:column;gap:4px}
.menu input{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:6px 8px;width:100%}
.menu ul{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto}
.menu li button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left;font-size:13px}
.menu li button:hover{background:var(--surface-2)}
.menu li button{justify-content:flex-start}.menu li button input{width:auto;flex:none;margin:0}
.foot-links{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.rules{display:flex;flex-direction:column;gap:10px}
.rules h5{margin:0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rules label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.rules label input{margin-top:2px;flex:none}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--gain)}
.exec-table{min-width:0}
.exec-table td,.exec-table th{padding:6px 6px}
.exec-add{display:grid;grid-template-columns:1.1fr .9fr .8fr 1fr auto;gap:6px}
.exec-add input,.exec-add select{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:5px 6px;min-width:0;font-size:12.5px}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.att{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.att img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.att button{position:absolute;right:5px;top:5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:1px 6px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* v14: trade preview + details */
.drawer{padding-bottom:0}
.drawer>*{flex-shrink:0}
.mm .fin{width:84px;max-width:84px;margin:0}
.mm:has(.fin){flex-wrap:nowrap}
.dr-foot{position:sticky;bottom:0;margin:auto -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.pvrows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin:0}
.pvrows dt,.pvrows dd{padding:8px 0;border-top:1px solid var(--line);margin:0;font-size:13px}
.pvrows dt{color:var(--muted)}
.pvrows dd{text-align:right;font-family:var(--f-num)}
.pvrows dd .fin{max-width:170px;margin-left:auto}
.mm{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.mm .chip.l{color:var(--loss);border-color:var(--loss-line)}.mm .chip.g{color:var(--gain);border-color:var(--gain-line)}
.spark{margin-top:4px}
.tick{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--muted)) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--muted)) 38%,var(--line))}
.dr-head .tick,.tv-title h1 .tick{font-size:17px;padding:2px 10px;border-radius:8px}
.sym-field{position:relative;min-width:0}.sym-field label{height:100%}
.sym-pick{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;width:auto;max-height:230px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 14px 36px rgba(0,0,0,.22);padding:10px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.sym-pick[hidden]{display:none}
.sym-g .label{margin-bottom:4px}.sym-row{display:flex;flex-wrap:wrap;gap:5px}
.sym-pick{padding:8px}.sym-pick .tick{font-size:11.5px;padding:1px 6px}.sym-foot .linkish{font-size:12px}
.sym-opt{background:none;border:0;padding:0;border-radius:6px}.sym-opt:hover .tick,.sym-opt:focus-visible .tick{filter:brightness(1.15);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.sym-foot{border-top:1px solid var(--line);padding-top:6px}
.sym-sw{display:flex;flex-wrap:wrap;gap:4px;max-width:330px}.sym-sw .sw{width:18px;height:18px}
.sym-sec{display:flex;flex-direction:column;gap:6px;margin-top:10px}.sym-table td{vertical-align:middle}
.tagbox .tsel{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:4px;background:none;border:0;padding:2px 4px;cursor:pointer}
.rtabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.rtabs button{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px}
.rtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chartcard{padding:0;overflow:hidden}
.chartcard .shot{display:block;width:100%;max-height:520px;object-fit:contain;background:var(--surface-2)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.section-head h3{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.runpnl{padding:0 16px 14px}
.runpnl svg{width:100%;height:auto;display:block}

/* notes editor */
.note-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.templates{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.tpl{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12px}
.tpl:hover{border-color:var(--accent)}
.etools{display:flex;gap:2px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;padding:4px;background:var(--surface-2);flex-wrap:wrap}
.etools button{border:0;background:none;border-radius:6px;padding:3px 8px;font-size:13px;color:var(--muted);min-width:28px}
.etools button:hover{background:var(--surface);color:var(--ink)}
.editor{border:1px solid var(--line);border-radius:0 0 9px 9px;min-height:200px;padding:12px 14px;background:var(--surface);line-height:1.6;outline:none;overflow-wrap:anywhere}
.editor:focus{border-color:var(--accent)}
.editor:empty::before{content:attr(data-ph);color:var(--muted)}
.editor h3{font-family:var(--f-display);font-size:16px;margin:10px 0 4px}
.editor h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px;color:var(--accent)}
.editor ul{padding-left:22px;margin:4px 0}
.editor li.todo{list-style:none;position:relative;margin-left:-4px;padding-left:4px}
.editor li.todo::before{content:"";position:absolute;left:-20px;top:5px;width:13px;height:13px;border:1.5px solid var(--muted);border-radius:3px;cursor:pointer}
.editor li.todo.done{color:var(--muted);text-decoration:line-through}
.editor li.todo.done::before{background:var(--gain);border-color:var(--gain)}
.saved{font-size:12px;color:var(--muted)}

/* playbooks */
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pb h3{margin:0;font-family:var(--f-display);font-size:17px}
.pb-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pb-stats b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.pb-edit{display:flex;flex-direction:column;gap:12px}
.pb-group{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pb-row{display:flex;gap:6px;align-items:center}
.pb-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:5px 8px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{max-width:900px}
.sheet h3{font-family:var(--f-display);margin:0;font-size:19px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form label{min-width:0}.form input,.form select,.form textarea{width:100%;box-sizing:border-box}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);min-width:0}
.form textarea{resize:vertical;min-height:60px}
.form h4{grid-column:1/-1;margin:6px 0 0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.primary.sm,.secondary.sm{padding:5px 10px;font-size:12.5px}
.secondary{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:500}
.daylist{display:flex;flex-direction:column;gap:8px}
.dtrade{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:none;text-align:left;width:100%}
.dtrade:hover{border-color:var(--muted)}
.dtrade .sym{font-weight:600}
.dtrade small{color:var(--muted);display:block;font-size:12px}
.lightbox img{width:100%;height:auto;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

/* progress tracker */
.h3{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.pt{display:grid;grid-template-columns:220px minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:stretch}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checklist li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.ri{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.ri.ok{background:var(--gain);border-color:var(--gain);color:#fff}
.ri.bad{border-color:var(--loss);color:var(--loss)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-columns:30px repeat(20,minmax(13px,1fr));gap:4px;min-width:400px}
.heat .ml{font-size:10.5px;color:var(--muted);white-space:nowrap}
.heat .dl{font-size:10.5px;color:var(--muted);align-self:center}
.hc{aspect-ratio:1;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);padding:0;max-width:100%;display:block}
.hc.h1{background:color-mix(in srgb,var(--gain) 25%,var(--surface-2));border-color:transparent}
.hc.h2{background:color-mix(in srgb,var(--gain) 50%,var(--surface-2));border-color:transparent}
.hc.h3{background:color-mix(in srgb,var(--gain) 75%,var(--surface-2));border-color:transparent}
.hc.h4{background:var(--gain);border-color:var(--gain)}
.hc.hx{background:var(--loss-bg);border-color:var(--loss-line)}
.hc.hf{background:transparent;border-style:dashed;opacity:.35}
.hc.today{outline:2px solid var(--accent);outline-offset:1px}
button.hc:hover{border-color:var(--ink)}
.hc.sw{width:12px;height:12px;display:inline-block}
.rtable{min-width:640px}
.rrows{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;flex-wrap:wrap}
.rrow label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.rin{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num)}
.rrow .fin{width:110px}
/* daily journal */
.grid.jgrid{grid-template-columns:minmax(0,1fr) 280px}
.jday{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.jhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jhead h3{margin:0;font-family:var(--f-display);font-size:16px}
.sp{flex:1}
.dbody{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center}
.dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 12px;margin:0}
.dstats dt{font-size:11.5px;color:var(--muted)}
.dstats dd{margin:2px 0 0;font-weight:600}
.jnote{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.jtrades{display:flex;gap:6px;flex-wrap:wrap}
.jtrades .tagchip{cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mini .dow{padding:0}
.mc{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--f-num);font-size:12px;padding:0;color:var(--muted)}
.mc:hover{border-color:var(--muted)}
.mc.win{background:var(--gain-bg);border-color:var(--gain-line);color:var(--gain)}
.mc.lose{background:var(--loss-bg);border-color:var(--loss-line);color:var(--loss)}
.mc.note{font-weight:700;color:var(--ink)}
.mc.today{outline:2px solid var(--accent);outline-offset:1px}
/* notebook */
.nb{display:grid;grid-template-columns:210px 280px minmax(0,1fr);gap:12px;align-items:start}
.nbfs{display:flex;flex-direction:column;gap:2px}
.nbf{display:flex;align-items:center;gap:4px}
.nbf-btn{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:left}
.nbf-btn:hover{background:var(--surface-2)}
.nbf-btn[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent);font-weight:600}
.nbl{display:flex;flex-direction:column;gap:4px;max-height:680px;overflow-y:auto}
.nbi{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;min-width:0}
.nbi:hover{background:var(--surface-2)}
.nbi[aria-pressed="true"]{background:var(--surface-2);border-color:var(--line)}
.nbi small{color:var(--muted);font-size:11.5px}
.nbi span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-meta{display:flex;gap:8px;align-items:center}
.nb-title{font-family:var(--f-display);font-size:17px;font-weight:700;flex:1}
/* reports */
.rep2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sumgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;margin:0}
.sumgrid div{border-bottom:1px solid var(--line);padding-bottom:8px;min-width:0}
.sumgrid dt{font-size:12px;color:var(--muted)}
.sumgrid dd{margin:2px 0 0;font-family:var(--f-num);font-size:17px;font-weight:600}
.nbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:110px;display:inline-block;vertical-align:middle;margin-left:10px}
.nbar span{display:block;height:100%}

/* dashboard v3 */
.dash3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dash-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:start}
.dash2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);font-size:9.5px;font-style:italic;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:help;color:var(--muted)}
.scorebar{position:relative;flex:1;padding-top:4px;min-width:0}
.scorebar .grad{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--loss),var(--accent) 50%,var(--gain))}
.scorebar i{position:absolute;top:0;width:3px;height:16px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.scorebar .ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:var(--f-num);margin-top:4px}
.score-total{gap:18px;align-items:center}
.recent{max-height:300px;overflow-y:auto}
.recent th{position:sticky;top:0;background:var(--surface)}
.lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.pmini{display:flex;align-items:center;gap:10px}
.pmini b{font-size:20px}
#tip{position:fixed;z-index:70;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 8px;border-radius:6px;pointer-events:none;font-family:var(--f-num);max-width:280px;white-space:normal;line-height:1.35}
/* v5: accounts, filters, import, drawer, home, replay, settings */
.ddwrap{position:relative}
.ddmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.15);padding:6px;min-width:230px;display:flex;flex-direction:column;gap:2px}
.ddrow{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.ddrow:hover{background:var(--surface-2)}
.ghost.on{border-color:var(--accent);color:var(--accent)}
.fgrid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;min-height:300px}
.ftabs{display:flex;flex-direction:column;gap:2px}
.ftabs button,.set-nav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px}
.ftabs button[aria-pressed="true"],.set-nav button[aria-pressed="true"]{background:var(--surface-2);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.fbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.fsec{display:flex;flex-direction:column;gap:6px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px}
.fchip:hover{border-color:var(--muted)}
.fchip.on,.fchip.in{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.fchip.out{background:var(--loss-bg);border-color:var(--loss-line);color:var(--loss);text-decoration:line-through}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.src{display:flex;flex-direction:column;gap:4px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;text-align:left}
.src:hover{border-color:var(--muted)}
.src span{font-size:12px;color:var(--muted)}
.src[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.primary:disabled{opacity:.45;cursor:default}
.scrim.side{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.dr-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dr-head h3{margin:0;font-family:var(--f-display);font-size:20px}
.dtable{min-width:840px}
.home{display:flex;flex-direction:column;gap:16px;max-width:1000px;margin:0 auto;width:100%}
.home-h{font-family:var(--f-display);font-size:30px;letter-spacing:-.02em;margin:8px 0 0;text-align:center;text-wrap:balance}
.ai-box{padding:16px;display:flex;flex-direction:column;gap:10px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:14.5px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:540px;overflow-y:auto}
.chat:empty{display:none}
.msg{border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.55;max-width:100%;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft);max-width:80%}
.msg.ai{background:var(--surface-2)}
.msg p,.ai-answer p{margin:0 0 6px}
.msg h4,.ai-answer h4{margin:8px 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.msg ul,.msg ol,.ai-answer ul,.ai-answer ol{margin:4px 0 6px;padding-left:20px}
.ai-answer{font-size:14px;line-height:1.6;max-height:60vh;overflow-y:auto;overflow-wrap:anywhere}

/* v15: insights */
.ins-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.ins{display:flex;flex-direction:column;gap:10px}
.ins-top{display:flex;justify-content:space-between;align-items:center}
.ins .label{display:flex;align-items:center;gap:7px;letter-spacing:.12em}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.live{width:8px;height:8px;border-radius:50%;background:var(--gain);box-shadow:0 0 0 3px var(--gain-line)}
.ins-q{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px 12px 4px 12px;padding:8px 12px;font-weight:500;max-width:90%}
.ins-ans{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.ins-ans .big{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.02em}
.ins-f{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted)}
.ins-f b{font-family:var(--f-num);margin-right:4px}
.ins-f li.dim{opacity:.6}
.ins-foot{margin-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gain);font-family:var(--f-num)}
.t-amber{color:var(--c-amber,#c98a12)}.t-gain{color:var(--gain)}.t-loss{color:var(--loss)}.t-muted{color:var(--muted)}
.t-bg-amber{background:var(--c-amber,#c98a12)}.t-bg-gain{background:var(--gain)}
.ins-box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ins-box.warn{border-color:color-mix(in srgb,var(--c-amber,#c98a12) 45%,var(--line))}
.ins-title{font-weight:600;margin-bottom:4px}.ins-box.warn .ins-title{color:var(--c-amber,#c98a12)}.ins-box.ok .ins-title{color:var(--gain)}

<script>
/* Standalone mode. Outside Claude there is no window.claude, so this provides the db, assets and downloads
   capabilities itself. When the site is deployed with its /api/docs backend (Vercel + DATABASE_URL), data is saved in
   the database behind a password. Anywhere else (a plain static host or a local file) it falls back to this
   browser's IndexedDB. Inside Claude this block does nothing. */
(() => {
  if (window.claude) return;
  const API = 'api/docs', AUTH = 'api/auth', KEY = 'll-key', DBN = 'ledgerline-local', STORE = 'docs';
  const mem = new Map(), docL = new Map(), colL = new Map(), pending = new Map();
  let mode = 'local', idb = null, cursor = null, queue = [], flushTimer = null, polling = null, apiKey = '';
  const err = (code, message) => Object.assign(new Error(message), { code, message });
  const clone = v => JSON.parse(JSON.stringify(v));
  const parentOf = p => p.split('/').slice(0, -1).join('/');
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };

  /* ---- browser storage (local mode, and a record of data saved before the database was connected) ---- */
  const openIdb = () => new Promise(res => { try { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } });
  const idbAll = () => new Promise(res => {
    const out = new Map();
    if (!idb) { try { const raw = localStorage.getItem(DBN); if (raw) Object.entries(JSON.parse(raw)).forEach(([k, v]) => out.set(k, v)); } catch (e) {} return res(out); }
    try { const rq = idb.transaction(STORE, 'readonly').objectStore(STORE).openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { out.set(c.key, c.value); c.continue(); } else res(out); }; rq.onerror = () => res(out); } catch (e) { res(out); }
  });
  const idbPut = (path, val) => new Promise((res, rej) => {
    if (!idb) { try { localStorage.setItem(DBN, JSON.stringify(Object.fromEntries(mem))); res(); } catch (e) { rej(err('quota_exceeded', 'Browser storage is full.')); } return; }
    try { const tx = idb.transaction(STORE, 'readwrite'), st = tx.objectStore(STORE); val === undefined ? st.delete(path) : st.put(val, path); tx.oncomplete = () => res(); tx.onerror = () => rej(err('quota_exceeded', 'Browser storage is full.')); } catch (e) { rej(err('unavailable', String(e))); }
  });
  const idbClear = () => new Promise(res => { if (!idb) { try { localStorage.removeItem(DBN); } catch (e) {} return res(); } try { const tx = idb.transaction(STORE, 'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });

  /* ---- server API ---- */
  async function api(method, query, body) {
    let r;
    try { r = await fetch(API + (query ? '?' + query : ''), { method, headers: { 'content-type': 'application/json', 'x-ledgerline-key': apiKey }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
    catch (e) { throw err('unavailable', "Can't reach the server. Check your connection."); }
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.status === 401) { lsSet(KEY, ''); showGate(apiKey ? 'Your session ended. Sign in again.' : ''); apiKey = ''; throw err('invalid_argument', 'Not signed in.'); }
    if (r.status === 413) throw err('quota_exceeded', j.error || 'Too large to save.');
    if (!r.ok) throw err('unavailable', j.error || `Server error ${r.status}`);
    return j;
  }
  async function loadAllRemote() {
    mem.clear(); let after = '', first = true;
    for (;;) { const j = await api('GET', after ? 'after=' + encodeURIComponent(after) : ''); if (first) { cursor = j.cursor; first = false; } j.docs.forEach(([p, d]) => mem.set(p, d)); if (!j.next) break; after = j.next; }
  }
  async function poll() {
    if (mode !== 'server' || !cursor || document.hidden) return;
    try {
      let exact = false;
      for (;;) {
        const j = await api('GET', 'since=' + encodeURIComponent(cursor) + (exact ? '&exact=1' : ''));
        j.changes.forEach(([p, d]) => {
          if (pending.has(p)) return;

function fillPnls(t) {
  const ex = (t.executions || []).slice().sort((a, b) => a.time.localeCompare(b.time)), mult = num(t.mult) || 1; let pos = 0, avg = 0;
  return ex.map(e => { const q = e.side === 'Buy' ? e.qty : -e.qty; let real = 0;

    else { const close = Math.min(Math.abs(q), Math.abs(pos)); real = (e.price - avg) * Math.sign(pos) * close * mult; const over = Math.abs(q) - close; pos += q; if (over > 0) avg = e.price; if (pos === 0) avg = 0; }

}

const strip = h => (h || '').replace(/<li[^>]*>/g, ' • ').replace(/<(br|p|div|h3|h4)[^>]*>/g, ' ').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();

/* ---------- progress tracker ---------- */
const DEFAULT_RULES = { startBy: '09:30', hoursFrom: '09:30', hoursTo: '16:00', days: [1, 2, 3, 4, 5], on: { hours: false, start: true, playbook: true, stop: true, lossTrade: true, lossDay: true }, playbookPct: 100, stopPct: 100, lossTrade: 150, lossTradeMode: '$', lossDay: 400, manual: [], resetFrom: '' };

function gauge(p) {
  const L = Math.PI * 40, col = p >= .8 ? 'var(--gain)' : p >= .5 ? 'var(--accent)' : 'var(--loss)';
  return `<svg viewBox="0 0 100 58" width="150" role="img" aria-label="${Math.round(p * 100)} percent"><path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="var(--surface-2)" stroke-width="9" stroke-linecap="round"/>${p > 0 ? `<path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(p * L).toFixed(1)} ${L.toFixed(1)}"/>` : ''}<text x="50" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)" font-family="var(--f-num)">${Math.round(p * 100)}%</text></svg>`;
}
function heatmap(scores, td, W = 20) {
  const [y, m, d] = td.split('-'), today = new Date(+y, +m - 1, +d), start = new Date(today);
  start.setDate(today.getDate() - today.getDay() - (W - 1) * 7);
  let head = '<span></span>', lastM = -1, body = '';
  for (let w = 0; w < W; w++) { const c = new Date(start); c.setDate(start.getDate() + w * 7); const mm = c.getMonth(); head += `<span class="ml">${mm !== lastM ? MONTHS[mm].slice(0, 3) : ''}</span>`; lastM = mm; }
  for (let r = 0; r < 7; r++) {
    body += `<span class="dl">${r % 2 ? DOW[r] : ''}</span>`;
    for (let w = 0; w < W; w++) {
      const c = new Date(start); c.setDate(start.getDate() + w * 7 + r); const k = iso(c);
      if (c > today) { body += '<span class="hc hf"></span>'; continue; }
      const s = scores[k], lv = !s ? 'h0' : s.score === 0 ? 'hx' : s.score < .5 ? 'h1' : s.score < .8 ? 'h2' : s.score < 1 ? 'h3' : 'h4';
      const txt = `${dateLabel(k)}${s ? `, ${s.p} of ${s.a} rules followed` : ', no activity'}`;
      body += `<button class="hc ${lv}${k === td ? ' today' : ''}" data-action="dlog" data-d="${k}" title="${txt}" aria-label="${txt}"></button>`;
    }
  }
  return `<div class="heat-wrap"><div class="heat" style="grid-template-columns:30px repeat(${W},minmax(13px,1fr));min-width:${W * 17 + 40}px">${head}${body}</div></div>
    <div class="legend" style="justify-content:flex-end;align-items:center;gap:5px">Fewer rules<span class="hc hx sw"></span><span class="hc h1 sw"></span><span class="hc h2 sw"></span><span class="hc h3 sw"></span><span class="hc h4 sw"></span>All rules</div>`;
}

const ruleIcon = e => `<span class="ri ${e.applies ? (e.pass ? 'ok' : 'bad') : 'wait'}" aria-label="${e.applies ? (e.pass ? 'Followed' : 'Missed') : 'Pending'}">${e.applies ? (e.pass ? '✓' : '✕') : ''}</span>`;

/* ---------- daily journal ---------- */
function dayStats(ts) {
  let w = 0, l = 0, gw = 0, gl = 0, fees = 0, vol = 0, net = 0;
  ts.forEach(t => { net += t.pnl; fees += num(t.fees) || 0; vol += num(t.qty) || 0; if (t.pnl > 0) { w++; gw += t.pnl; } else if (t.pnl < 0) { l++; gl -= t.pnl; } });
  return { n: ts.length, w, l, net, gross: net + fees, fees, vol, wr: (w + l) ? w / (w + l) : 0, pf: gl ? gw / gl : (gw ? Infinity : 0) };
}
function intraday(ts) { let c = 0; return [['', 0], ...ts.slice().sort((a, b) => (a.time || '').localeCompare(b.time || '')).map(t => [t.time || '', c += t.pnl])]; }
function dayBody(d, ts) {

  { id: 'rm1', track: 'Risk management', title: 'Risk per trade: the 1% idea', min: 4, body: `
<p>Most accounts don't die from one bad idea. They die from sizing that turns a normal losing streak into a hole you can't climb out of. Fixing the amount you risk on every trade is the cheapest edge there is.</p>
<h4>The rule</h4><p>Decide a fixed slice of your account you're willing to lose if the stop is hit, commonly 0.5–1%. On a $25,000 account, 1% is $250. Your position size comes from that number, not from how confident you feel.</p>
<h4>Why it works</h4><ul><li>Ten losses in a row at 1% costs about 9.6% of the account. At 5% it costs about 40%.</li><li>A drawdown of 40% needs a 67% gain to recover. Small risk keeps recoveries realistic.</li><li>Your results become comparable in R (multiples of risk), which is how this journal measures you.</li></ul>
<h4>Put it into practice</h4><ol><li>Set your risk in dollars before the session.</li><li>Use the position size calculator in Tools for every trade.</li><li>Log the risk on each trade so R-multiples are accurate.</li></ol>`, quiz: [['A $40,000 account risking 0.5% per trade risks how much?', ['$20', '$200', '$2,000'], 1], ['After a 50% drawdown, what gain gets you back to even?', ['50%', '75%', '100%'], 2]] },
  { id: 'rm2', track: 'Risk management', title: 'Position sizing from your stop', min: 5, body: `
<p>Size is the output of three inputs: how much you'll risk, where your stop is, and what one point is worth.</p>
<h4>The formula</h4><p><b>Size = risk in $ ÷ (distance to stop × value per point)</b></p><ul><li>Stocks: value per point is $1 per share. Risk $200, stop $0.50 away → 400 shares.</li><li>ES futures: $50 per point. Risk $300, stop 4 points away → 300 ÷ 200 = 1.5, so 1 contract.</li><li>Forex: one standard lot is roughly $10 per pip on USD-quoted pairs. Risk $150, stop 15 pips → 1 lot.</li></ul>
<h4>Common mistakes</h4><ul><li>Picking size first and then squeezing the stop to fit. The stop belongs where the idea is wrong.</li><li>Rounding up. Always round size down.</li><li>Forgetting fees and slippage on very tight stops.</li></ul>`, quiz: [['Risk $500, stop 2.5 points on NQ ($20/pt). How many contracts?', ['5', '10', '25'], 1]] },
  { id: 'rm3', track: 'Risk management', title: 'Daily loss limits and stopping rules', min: 4, body: `
<p>The worst trades of the month usually come after you're already down. A daily loss limit takes that decision away from the version of you that's upset.</p>
<h4>Set three limits</h4><ul><li><b>Max daily loss:</b> often 2–3R. Hit it and you're done for the day.</li><li><b>Max trades:</b> the number after which your results get worse. Check Behavior alerts on Home to find yours.</li><li><b>Max consecutive losses:</b> two or three in a row means step away for 30 minutes.</li></ul>
<p>Enter them in Progress tracker → Rules and as a custom agent (e.g. "warn me on my 4th trade of the day") so the journal holds you to them.</p>`, quiz: [['What is the main purpose of a daily loss limit?', ['To make more trades', 'To stop decisions made while tilted', 'To avoid fees'], 1]] },
  { id: 'ps1', track: 'Psychology', title: 'Revenge trading and tilt', min: 5, body: `
<p>Revenge trading is entering again quickly to win back a loss. It feels like action; it's usually a lower-quality trade at bigger size.</p>
<h4>Signs</h4><ul><li>Re-entering within a few minutes of a loss.</li><li>Size above your normal.</li><li>Trading a setup that isn't in your playbook.</li></ul>
<h4>What helps</h4><ol><li>A mandatory pause after a loss, for example 10–30 minutes. Your Behavior alert card shows your win rate when you wait.</li><li>Write one line in your journal before the next trade: what was the loss, was it a good trade?</li><li>Set a custom agent that flags trades within 5 minutes of a loss.</li></ol>`, quiz: [['Which is a classic sign of revenge trading?', ['Waiting 30 minutes', 'Bigger size right after a loss', 'Journaling'], 1]] },
  { id: 'ps2', track: 'Psychology', title: 'Process over outcome', min: 4, body: `
<p>A good trade can lose and a bad trade can win. If you grade yourself on P&amp;L alone, you'll reinforce luck and punish discipline.</p>
<h4>Grade the process</h4><ul><li>Was it a playbook setup?</li><li>Was size correct for the stop?</li><li>Did you follow the exit plan?</li></ul>
<p>Use playbook rule checks and the trade rating on every trade. Over weeks, compare P&amp;L of trades where you followed all rules versus the rest (Reports → by playbook).</p>`, quiz: [['A trade followed every rule but lost. How should it be graded?', ['As a mistake', 'As a good trade', 'Delete it'], 1]] },
  { id: 'ps3', track: 'Psychology', title: 'FOMO and chasing', min: 3, body: `
<p>Fear of missing out makes you enter late, far from your planned level, with a worse stop. The move you chase has already used part of its reward.</p>
<ul><li>Define the entry zone before price gets there. If it's gone, it's gone.</li><li>Tag chased entries as a mistake so you can see their cost in Reports.</li><li>Remember: there's another setup tomorrow. Missing a trade costs nothing; chasing one costs money.</li></ul>`, quiz: [] },
  { id: 'ta1', track: 'Technical analysis', title: 'Support, resistance and levels', min: 5, body: `
<p>Levels are prices where buyers or sellers acted before: prior highs and lows, the previous day's high/low/close, the opening range, round numbers and VWAP.</p>
<h4>Using them</h4><ul><li>Mark them before the open in your pre-market briefing.</li><li>Expect reaction, not certainty. A level is a place to watch, not a reason to enter.</li><li>A clean break and hold often turns resistance into support (and the reverse).</li></ul>
<h4>Quality checks</h4><ul><li>How many times did price react there?</li><li>Was it a higher timeframe level?</li><li>Is there room to the next level for your target?</li></ul>`, quiz: [['Which is usually a stronger level?', ['A 1-minute swing', 'The previous day high', 'A random price'], 1]] },
  { id: 'ta2', track: 'Technical analysis', title: 'Trend, structure and pullbacks', min: 5, body: `
<p>An uptrend makes higher highs and higher lows; a downtrend makes lower highs and lower lows. Trading with the structure gives you the wind at your back.</p>
<ul><li>In an uptrend, buy pullbacks into support (prior breakout level, rising moving average, VWAP).</li><li>A break of the last higher low is the first warning that structure is changing.</li><li>Ranges are different: fade the edges or wait for a breakout, don't trade the middle.</li></ul>`, quiz: [['A break below the last higher low suggests…', ['Trend strengthening', 'Possible change in structure', 'Nothing'], 1]] },
  { id: 'ta3', track: 'Technical analysis', title: 'VWAP and volume', min: 4, body: `
<p>VWAP is the average price weighted by volume since the session started. Many intraday traders and algorithms reference it, which is why price often reacts there.</p>
<ul><li>Above VWAP, buyers are in control on average; below it, sellers are.</li><li>A reclaim of VWAP after a flush is a common long setup; a rejection from below is a common short.</li><li>Rising volume on a breakout confirms participation; a breakout on thin volume fails more often.</li></ul>`, quiz: [] },
  { id: 'mk1', track: 'Markets & orders', title: 'Order types: market, limit, stop', min: 4, body: `
<ul><li><b>Market:</b> fills now at the best available price. Fast, but you pay the spread and can slip.</li><li><b>Limit:</b> fills at your price or better. You may not get filled.</li><li><b>Stop (stop-market):</b> becomes a market order when price trades through your level. Used for stop losses and breakout entries.</li><li><b>Stop-limit:</b> becomes a limit order at the trigger; protects price but may not fill in a fast move.</li><li><b>Bracket / OCO:</b> a target and a stop attached to your entry; when one fills, the other cancels.</li></ul>
<p>Use brackets so your stop is in the market the moment you're filled.</p>`, quiz: [['Which order guarantees price but not a fill?', ['Market', 'Limit', 'Stop-market'], 1]] },
  { id: 'mk2', track: 'Markets & orders', title: 'Futures, forex and stocks: what differs', min: 5, body: `
<ul><li><b>Futures:</b> standardized contracts with a fixed value per point (ES $50, NQ $20, MES $5, MNQ $2). Nearly 24-hour trading, leverage set by exchange margin.</li><li><b>Forex:</b> traded in lots (standard 100,000, mini 10,000, micro 1,000 units). Moves measured in pips. Spreads and swap fees matter.</li><li><b>Stocks:</b> priced per share, regular hours 9:30–16:00 ET with pre and post market. Watch liquidity and halts.</li></ul>
<p>In this journal set the point value on each trade (or via Commissions &amp; fees) so P&amp;L and R are right.</p>`, quiz: [['What is MNQ worth per point?', ['$2', '$5', '$20'], 0]] },
  { id: 'jr1', track: 'Journaling & review', title: 'A weekly review that changes something', min: 4, body: `
<ol><li><b>Numbers:</b> net P&amp;L, win rate, average win vs loss, R. Dashboard → Week.</li><li><b>Best and worst 3 trades:</b> what made them so? Look at playbook checks and tags.</li><li><b>Mistake cost:</b> Reports → by mistake tag. Which mistake cost the most R?</li><li><b>One change:</b> pick a single rule for next week and add it to Progress tracker.</li></ol>
<p>Ask Claude on Home to "Review my last 5 trading days" for a first draft, then edit it in your own words.</p>`, quiz: [] }
];

function stratPb(st) { return S.playbooks.find(p => p.stratId === st.id && !p.archived) || S.playbooks.find(p => p.name === st.name && !p.archived); }
function stratStats(st) {
  const pb = stratPb(st); if (!pb) return null;
  const ts = S.allTrades.filter(t => t.playbookId === pb.id), w = ts.filter(t => t.pnl > 0), l = ts.filter(t => t.pnl < 0), gw = w.reduce((a, t) => a + t.pnl, 0), gl = -l.reduce((a, t) => a + t.pnl, 0);
  return { pb, ts, n: ts.length, wr: ts.length ? w.length / ts.length : 0, wl: w.length && l.length ? (gw / w.length) / (gl / l.length) : null, pf: gl ? gw / gl : (gw ? Infinity : null) };
}
function stratStatRow(st) {

}

/* ---------- writes ---------- */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }
function writeErr(e) {
  if (e && e.code === 'invalid_argument') toast("You don't have permission to change this journal.");
  else if (e && e.code === 'quota_exceeded') toast('The journal is full. Delete some old trades to add new ones.');
  else { toast("That didn't save. Check your connection and try again."); if (window.__llLocal && window.__llLocal.mode === 'server') { S.netErr = "Some changes didn't reach the database. Check your connection; changes made after it's back will save normally."; rerender(); } }
}
function needDb() { if (!S.db) { toast("Saving isn't available in this view."); return false; } return true; }
const queues = {};
function patchTrade(id, patch, quiet) {
  const t = byId(id); if (!t || !needDb()) return;
  Object.assign(t, patch);
  const p = calcPnl(t); if (p != null && p !== t.pnl) { t.pnl = p; patch.pnl = p; }
  if (!quiet) safeRender();
  queues[id] = (queues[id] || Promise.resolve()).then(() => S.db.collection('trades').doc(id).update(patch)).catch(writeErr);
  return queues[id];
}
function saveCat(c) { return S.db.collection('tagcats').doc(c.id).set({ name: c.name, color: c.color, order: c.order ?? 0, tags: c.tags || [] }).catch(writeErr); }
function ensureTagInCat(catId, tag) { const c = catById(catId); if (c && !(c.tags || []).includes(tag)) { c.tags = [...(c.tags || []), tag]; saveCat(c); } }

let noteTimer = null;
function saveNote(immediate) {
  const ed = $('editor'); if (!ed || !S.db) return;
  clearTimeout(noteTimer);
  const go = () => {
    const html = sanitize(ed.innerHTML), kind = ed.dataset.kind, key = ed.dataset.key;
    const mark = $('savedMark');
    let p;
    if (kind === 'trade') { const t = byId(key); if (!t || t.note === html) return; t.note = html; p = S.db.collection('trades').doc(key).update({ note: html }); }
    else if (kind === 'note') { const n = S.notes.find(x => x.id === key); if (!n || n.html === html) return; n.html = html; n.updatedAt = new Date().toISOString(); p = S.db.collection('notes').doc(key).update({ html, updatedAt: n.updatedAt }); }
    else { if ((S.journal[key] || {}).html === html) return; p = saveJournal(key, { html, updatedAt: new Date().toISOString() }); }
    if (mark) mark.textContent = 'Saving…';
    p.then(() => { const m = $('savedMark'); if (m) m.textContent = 'Saved'; }).catch(writeErr);
  };
  if (immediate) go(); else noteTimer = setTimeout(go, 1000);
}

async function uploadFiles(files, tradeId) {
  if (!S.assets || !needDb()) return;
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return toast('Choose an image file (PNG, JPG, GIF or WebP).');
  toast('Uploading…');
  const t = byId(tradeId); if (!t) return;
  const added = [];
  for (const f of imgs) {
    if (f.size > 20 * 1024 * 1024) { toast(`${f.name} is over 20 MB.`); continue; }
    try { const r = await S.assets.upload(f); added.push({ id: r.id, url: r.url, name: f.name.slice(0, 80) }); } catch (e) { toast("That image didn't upload. Try again."); }
  }
  if (added.length) { await patchTrade(tradeId, { attachments: [...(t.attachments || []), ...added] }); toast(added.length > 1 ? `${added.length} images added` : 'Image added'); }
}

/* ---------- events ---------- */
function showTip(e) {
  const tip = $('tip'), el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
  const r = tip.getBoundingClientRect(), x = e.clientX ?? (el.getBoundingClientRect().left), y = e.clientY ?? (el.getBoundingClientRect().top);
  tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x + 12)) + 'px';
  tip.style.top = Math.max(8, y - r.height - 10) + 'px';
}
document.addEventListener('mousemove', showTip);
document.addEventListener('focusin', e => { if (e.target.closest && e.target.closest('[data-tip]')) { const b = e.target.getBoundingClientRect(); showTip({ target: e.target, clientX: b.left, clientY: b.top }); } });
document.addEventListener('mouseleave', () => { $('tip').hidden = true; });
document.addEventListener('mousedown', e => { if (e.target.closest('.etools button')) e.preventDefault(); });
document.addEventListener('click', async e => {
  const ed = e.target.closest('.editor');
  if (ed) { const li = e.target.closest('li.todo'); if (li) { const rect = li.getBoundingClientRect(); if (e.clientX < rect.left + 4) { li.classList.toggle('done'); saveNote(); } } return; }
  const b = e.target.closest('[data-action]');
  if (S.profMenu && !e.target.closest('#railProfile')) { S.profMenu = false; renderProfile(); }
  if (!b) { if ((S.accMenu || S.dashMenu || S.repMenu) && !e.target.closest('.ddwrap')) { S.accMenu = false; S.dashMenu = false; S.repMenu = false; rerender(); } if (e.target === $('modal')) { saveNote(true); S.prevModal = null; closeModal(); } if (S.tagMenu && !e.target.closest('.menu')) { S.tagMenu = null; render(); } return; }
  const a = b.dataset.action, id = b.dataset.id;
  if (a !== 'fmt' && a !== 'tpl' && $('editor')) saveNote(true);
  if (!['del', 'delTrade', 'clearSamples', 'bulkDelete', 'delPb', 'delCat', 'delNote', 'delFolder', 'acctDel', 'undoImport', 'tplDel', 'econDel', 'propDel', 'propTxDel', 'dashDelete', 'resetTracker', 'caDel', 'acctUnlink', 'vidDel', 'userDel'].includes(a)) S.armed = null;
  if (a === 'sel' || a === 'selAll' || a === 'toggleRev') e.stopPropagation();
  switch (a) {
    case 'add': if (!needDb()) return; return openModal('add', b.dataset.d);
    case 'close': return closeModal();
    case 'view': S.view = b.dataset.view; if (b.closest('.nav')) { if (S.view === 'props') S.propTab = 'dash'; if (S.view === 'agents') S.agTab = 'agents'; } S.tagMenu = null; S.accMenu = false; S.prevModal = null; closeModal(); rpStop(); window.scrollTo(0, 0); break;
    case 'unit': S.unit = b.dataset.v; try { localStorage.setItem('ll-unit', S.unit); } catch (_) {} break;
    case 'scope': S.scope = b.dataset.v; try { localStorage.setItem('ll-scope', S.scope); } catch (_) {} break;
    case 'month': S.month = new Date(S.month.getFullYear(), S.month.getMonth() + +b.dataset.v, 1); break;

      risk: g('fRisk') || 0, pnl: 0, playbookId: $('fPb').value, accountId: $('fAcc') ? $('fAcc').value : 'main', tags: {}, rulesChecked: [], executions: [], attachments: [], note: '', reviewed: false, rating: 0, sample: false, createdAt: new Date().toISOString() };
    const calc = calcPnl(t), manual = g('fPnl');
    t.pnl = calc != null ? calc : manual;
    if (S.agents.tagger.on && S.agents.tagger.manual && t.pnl != null) { const at = autoTags(t); if (at) { t.tags = at; (S.agents.tagger.rules || []).forEach(r => r.cat && r.tag && ensureTagInCat(r.cat, r.tag)); } }
    if (!sym || t.pnl == null) return toast('Add a symbol, plus either entry, exit and quantity or a net P&L.');
    const fired = runCustomOnTrade(t); fired.forEach(a => { if (a.tag && a.tag.cat && a.tag.tag) { ensureTagInCat(a.tag.cat, a.tag.tag); t.tags = { ...t.tags, [a.tag.cat]: [...new Set([...(t.tags[a.tag.cat] || []), a.tag.tag])] }; } });
    try { const ref = await S.db.collection('trades').add(t); closeModal(); toast(fired.length ? `Trade saved · ⚑ ${fired.map(a => a.name).join(', ')}` : 'Trade saved'); S.view = 'trade'; S.tradeId = ref.id; S.tab = 'stats'; const [y, m] = t.date.split('-'); S.month = new Date(+y, +m - 1, 1); render(); } catch (err) { writeErr(err); }
  }
  if (f.dataset.form === 'bal') {
    const v = parseFloat($('balInput').value); if (isNaN(v) || v < 0) return toast('Enter a starting balance of 0 or more.');
    try { await S.db.doc('settings/account').set({ startingBalance: v }); S.editBal = false; render(); toast('Starting balance saved'); } catch (err) { writeErr(err); }
  }
  if (f.dataset.form === 'exec') {
    const id = f.dataset.id, t = byId(id);
    const ex = { id: uid(), time: $('exTime').value.length === 5 ? $('exTime').value + ':00' : $('exTime').value, side: $('exSide').value, qty: num($('exQty').value), price: num($('exPrice').value) };
    if (!ex.time || !ex.qty || ex.price == null) return toast('Each fill needs a time, quantity and price.');
    await patchTrade(id, { executions: [...(t.executions || []), ex] });
    setTimeout(() => { $('exPrice')?.focus(); }, 30);
  }
  if (f.dataset.form === 'econ') {
    if (!needDb()) return; const id = f.dataset.id || 'e-' + uid();
    const ev = { date: $('eDate').value, time: $('eTime').value, country: $('eCountry').value.trim().slice(0, 30), event: $('eName').value.trim().slice(0, 120), impact: $('eImpact').value, forecast: $('eForecast').value.trim().slice(0, 20), previous: $('ePrev').value.trim().slice(0, 20), actual: $('eActual').value.trim().slice(0, 20), note: $('eNote').value.trim().slice(0, 140) };
    if (!ev.date || !ev.event) return toast('An event needs a date and a name.');
    try { await S.db.collection('econ').doc(id).set(ev); S.econ = [...S.econ.filter(e => e.id !== id), { ...ev, id }]; S.ecoWeek = weekKey(ev.date); closeModal(); render(); toast('Event saved'); } catch (err) { writeErr(err); } return;
  }
  if (f.dataset.form === 'prop') {
    if (!needDb()) return; const id = f.dataset.id || 'p-' + uid(), isNew = !f.dataset.id;
    const pr = { firm: $('pFirm').value.trim().slice(0, 40), name: $('pName').value.trim().slice(0, 60), size: +$('pSize').value || 0, type: $('pType').value, status: $('pStatus').value, breach: $('pStatus').value === 'failed' ? $('pBreach').value : '', started: $('pStart').value, ended: $('pEnd').value, strategy: $('pStrat').value.trim().slice(0, 60), accountId: $('pAcc').value };
    if (!pr.firm) return toast('Add the firm name.');
    try { await S.db.collection('props').doc(id).set(pr); const fee = isNew && $('pFee') ? +$('pFee').value : 0; if (fee > 0) await S.db.collection('propTx').doc('x-' + uid()).set({ date: pr.started || todayIso(), kind: 'fee', amount: fee, propId: id, firm: pr.firm, note: 'Evaluation fee' }); closeModal(); render(); toast('Prop account saved'); } catch (err) { writeErr(err); } return;
  }
  if (f.dataset.form === 'propTx') {
    if (!needDb()) return; const amt = +$('xAmt').value; if (!(amt > 0)) return toast('Enter an amount above 0.');
    const pid = $('xProp').value, pr = S.props.find(x => x.id === pid) || {};
    const x = { date: $('xDate').value, kind: $('xKind').value, amount: Math.round(amt * 100) / 100, propId: pid, firm: pr.firm || $('xFirm').value.trim().slice(0, 40), note: $('xNote').value.trim().slice(0, 120) };
    try { await S.db.collection('propTx').doc('x-' + uid()).set(x); closeModal(); render(); toast(x.kind === 'payout' ? 'Payout logged' : 'Expense logged'); } catch (err) { writeErr(err); } return;
  }
  if (f.dataset.form === 'btParse') { const text = $('btText').value.trim(); if (!text) return; S.bt.text = text; S.btBusy = true; rerender(); const j = await aiJson(btPrompt(text)); S.btBusy = false;
    if (j) { const B = BT_DEFAULT(); Object.keys(B).forEach(k => { if (j[k] != null && j[k] !== '' && k !== 'text') B[k] = Array.isArray(B[k]) ? [].concat(j[k]).map(Number).filter(n => n >= 1 && n <= 5) : typeof B[k] === 'number' ? (+j[k] || B[k]) : String(j[k]); }); B.text = text; B.symbol = String(B.symbol || '').toUpperCase(); S.bt = B; toast('Rules built. Check them, then run the backtest.'); } rerender(); return; }
  if (f.dataset.form === 'caParse') { if (!needDb()) return; const text = $('caText').value.trim(); if (!text) return; S.caBusy = true; rerender(); const j = await aiJson(caPrompt(text)); S.caBusy = false;
    if (j) { const a = caFromJson(j, text); S.agents.custom = [a, ...(S.agents.custom || [])]; saveAgents(); toast(`“${a.name}” is on. ${agentHits(a, S.trades).length} past trades match.`); } rerender(); return; }
  if (f.dataset.form === 'tgParse') { if (!needDb()) return; const text = $('tgText').value.trim(); if (!text) return; S.tgBusy = true; rerender();
    const j = await aiJson(`Turn this auto-tagging instruction into a JSON array of rules [{"field","op","value","cat","tag"}]. Each rule is one condition that adds one tag. Fields: ${TAG_FIELDS.map(([k, l]) => `${k} (${l})`).join(', ')}. Ops: ${TAG_OPS.join(' ')}. Categories: ${S.cats.map(c => `${c.id} (${c.name})`).join(', ')}.\nInstruction: ${text}`); S.tgBusy = false;
    const rules = [].concat(j || []).filter(r => r && TAG_FIELDS.some(x => x[0] === r.field) && TAG_OPS.includes(r.op) && catById(r.cat) && r.tag).map(r => ({ id: 'r' + uid(), field: r.field, op: r.op, value: String(r.value), cat: r.cat, tag: String(r.tag).slice(0, 40) }));
    if (rules.length) { S.agents.tagger.rules = [...(S.agents.tagger.rules || []), ...rules]; rules.forEach(r => ensureTagInCat(r.cat, r.tag)); saveAgents(); toast(`Added ${rules.length} rule${rules.length === 1 ? '' : 's'}. Use “Run on existing trades” to tag past trades.`); } else if (j) toast("Claude couldn't turn that into a rule. Try naming a field, like hold time or entry time."); rerender(); return; }
  if (f.dataset.form === 'video') { if (!needDb()) return; const url = $('vUrl').value.trim(), yt = ytId(url); if (!yt) { toast("That doesn't look like a YouTube link."); return; } try { await S.db.collection('videos').doc('v-' + uid()).set({ yt, url, title: ($('vTitle').value.trim() || 'Untitled video').slice(0, 120), cat: $('vCat').value.trim().slice(0, 40), note: '', at: new Date().toISOString() }); toast('Video saved'); } catch (err) { writeErr(err); } return; }
  if (f.dataset.form === 'symAdd') { if (!needDb()) return; const sym = $('symNew').value.trim().toUpperCase().slice(0, 20); if (!sym) return; const i = symInfo(sym); upsertSym(sym, { cat: $('symNewCat').value.trim().slice(0, 40) || (i.auto ? 'Other' : i.cat), color: i.color, mult: i.mult, tick: i.tick, hidden: false }); saveSymSet(); toast(sym + ' added'); rerender(); return; }
  if (f.dataset.form === 'aip') { const q = ($('aipIn').value || '').trim(); if (!q) return; S.aipDraft = ''; askClaude(q); return; }
  if (f.dataset.form === 'userAdd') { await usersCall({ action: 'createUser', username: $('nuName').value.trim().toLowerCase(), password: $('nuPw').value, admin: $('nuAdmin').checked }, 'User created'); return; }
  if (f.dataset.form === 'userPw') { await usersCall({ action: 'resetPassword', username: f.dataset.v, password: $('upw').value }, 'Password reset'); return; }
  if (f.dataset.form === 'pwChange') { if ($('pwNew').value !== $('pwNew2').value) { toast("The new passwords don't match."); return; } try { await window.__llLocal.auth({ action: 'changePassword', current: $('pwCur').value, next: $('pwNew').value }); toast('Password changed'); f.reset(); } catch (e) { toast(e.message); } return; }
  if (f.dataset.form === 'pattern') { const q = ($('patIn').value || '').trim(); if (q) { S.patternQ = q; rerender(); } return; }
  if (f.dataset.form === 'sentiment') { if (!needDb()) return; const v = $('sVix').value, sp = $('sSpy').value; S.agents.sentiment = { date: todayIso(), vix: v === '' ? null : +v, spy: sp === '' ? null : +sp }; S.sentEdit = false; saveAgents(); rerender(); return; }
  if (f.dataset.form === 'ask') { const q = ($('askIn').value || '').trim(); S.askDraft = ''; askClaude(q); return; }
  if (f.dataset.form === 'acct') {
    if (!needDb()) return; const id = f.dataset.id || 'acc-' + uid(), name = $('acName').value.trim().slice(0, 60); if (!name) return;
    const prev = S.accounts.find(a => a.id === id) || {};
    const doc = { name, broker: $('acBroker').value.trim().slice(0, 40), startingBalance: +$('acStart').value || 0, order: prev.order ?? (id === 'main' ? 0 : Date.now()) };
    try { await S.db.collection('accounts').doc(id).set(doc); S.accounts = [...S.accounts.filter(a => a.id !== id), { ...doc, id }]; closeModal(); rerender(); toast('Account saved'); } catch (err) { writeErr(err); } return;
  }
  if (f.dataset.form === 'tplSave') {
    if (!needDb()) return; const name = $('tplName').value.trim().slice(0, 40); if (!name) return; const id = 'tpl-' + uid();
    try { await S.db.collection('templates').doc(id).set({ name, html: S.tplDraft || '' }); S.templates = [...S.templates, { id, name, html: S.tplDraft }]; closeModal(); rerender(); toast('Template saved'); } catch (err) { writeErr(err); } return;
  }
  if (f.dataset.form === 'cash') {
    if (!needDb()) return; const amt = num($('cAmt').value); if (!amt || amt <= 0) return toast('Enter an amount above 0.');
    const c = { date: $('cDate').value, amount: $('cType').value === 'Withdrawal' ? -amt : amt, note: $('cNote').value.trim().slice(0, 120), accountId: $('cAcc') ? $('cAcc').value : 'main' };
    try { await S.db.collection('cash').add(c); toast(c.amount > 0 ? 'Deposit added' : 'Withdrawal added'); } catch (err) { writeErr(err); }
  }
  if (f.dataset.form === 'folder') {
    const name = $('folderName').value.trim(); if (!name) return;
    const fo = { id: 'f-' + uid(), name: name.slice(0, 40) }; S.folders = [...S.folders, fo]; S.nbFolder = fo.id; S.nbSel = null;
    try { await S.db.doc('settings/notebook').set({ folders: S.folders }); closeModal(); render(); toast('Folder added'); } catch (err) { writeErr(err); }
  }
  if (f.dataset.form === 'cat') {
    const name = $('catName').value.trim(); if (!name) return;
    const c = { id: 'cat-' + uid(), name: name.slice(0, 40), color: $('catColor').value, order: S.cats.length, tags: [] };
    S.cats.push(c); await saveCat(c); closeModal(); render(); toast('Category added');
  }
});

/* ---------- data ---------- */
render();
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) { S.dbMissing = true; S.loaded = true; render(); return; }
  S.db = db;
  window.claude.use('assets').then(a => { S.assets = a; safeRender(); }).catch(() => {});
  db.collection('trades').onSnapshot(snap => {
    S.allTrades = snap.docs.map(d => { const x = d.data(); return { ...x, id: d.id, pnl: +x.pnl || 0 }; }).filter(t => t.date); applyFilters();
    S.loaded = true; safeRender();
  }, () => { S.loaded = true; safeRender(); });
  db.collection('tagcats').onSnapshot(snap => { S.cats = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); safeRender(); }, () => {});
  db.collection('playbooks').onSnapshot(snap => { S.playbooks = snap.docs.map(d => ({ groups: [], ...d.data(), id: d.id })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); safeRender(); }, () => {});
  db.collection('journal').onSnapshot(snap => { const j = {}; snap.docs.forEach(d => j[d.id] = d.data()); S.journal = j; safeRender(); }, () => {});
  db.doc('settings/rules').onSnapshot(s => { if (s.exists) { const x = s.data(); S.rules = { ...DEFAULT_RULES, ...x, on: { ...DEFAULT_RULES.on, ...(x.on || {}) }, manual: x.manual || [] }; } else S.rules = DEFAULT_RULES; safeRender(); }, () => {});
  db.collection('accounts').onSnapshot(snap => { S.accounts = snap.docs.map(d => ({ ...d.data(), id: d.id })); applyFilters(); safeRender(); if (!S._autoSynced) setTimeout(autoSyncDue, 4000); }, () => {});
  db.collection('dashTemplates').onSnapshot(snap => { S.dashDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); safeRender(); }, () => {});
  db.collection('econ').onSnapshot(snap => { S.econ = snap.docs.map(d => ({ ...d.data(), id: d.id })).filter(e => e.date && e.event); safeRender(); }, () => {});
  db.collection('props').onSnapshot(snap => { S.props = snap.docs.map(d => ({ ...d.data(), id: d.id })).filter(x => x.firm); safeRender(); }, () => {});
  db.collection('propTx').onSnapshot(snap => { S.propTx = snap.docs.map(d => ({ ...d.data(), id: d.id })).filter(x => x.date && x.kind); safeRender(); }, () => {});
  db.doc('settings/agents').onSnapshot(sn => { const D = DEFAULT_AGENTS(); if (sn.exists) { const x = sn.data(); S.agents = { brief: { ...D.brief, ...(x.brief || {}) }, tagger: { ...D.tagger, ...(x.tagger || {}) }, review: { ...D.review, ...(x.review || {}) }, sentiment: { ...D.sentiment, ...(x.sentiment || {}) }, custom: Array.isArray(x.custom) ? x.custom : [], limits: { ...D.limits, ...(x.limits || {}) } }; } safeRender(); }, () => {});
  db.collection('imports').onSnapshot(snap => { S.imports = snap.docs.map(d => ({ ...d.data(), id: d.id })); safeRender(); }, () => {});
  db.collection('templates').onSnapshot(snap => { S.templates = snap.docs.map(d => ({ ...d.data(), id: d.id })).filter(t => t.name); safeRender(); }, () => {});
  db.doc('settings/fees').onSnapshot(s => { S.fees = s.exists ? (s.data().rows || []) : []; safeRender(); }, () => {});
  db.collection('cash').onSnapshot(snap => { S.cash = snap.docs.map(d => ({ ...d.data(), id: d.id })).filter(c => c.date && typeof c.amount === 'number'); safeRender(); }, () => {});
  db.doc('settings/symbols').onSnapshot(sn => { if (sn.exists) { S.symSet = { list: [], ...sn.data() }; safeRender(); } }, () => {});
  db.collection('videos').onSnapshot(snap => { S.videos = snap.docs.map(d => ({ ...d.data(), id: d.id })); safeRender(); }, () => {});
  db.doc('settings/learn').onSnapshot(sn => { if (sn.exists) { S.learn = sn.data(); safeRender(); } }, () => {});
  db.collection('notes').onSnapshot(snap => { S.notes = snap.docs.map(d => ({ ...d.data(), id: d.id })); safeRender(); }, () => {});
  db.doc('settings/notebook').onSnapshot(s => { S.folders = s.exists ? (s.data().folders || []) : []; safeRender(); }, () => {});
  db.doc('settings/account').onSnapshot(s => { if (s.exists) { const d = s.data(); S.settings = { ...S.settings, ...d }; if (d.theme && THEMES.some(x => x[0] === d.theme) && d.theme !== getTheme()) { try { localStorage.setItem('ll-theme', d.theme); } catch (e) {} applyTheme(d.theme); } safeRender(); renderProfile(); } }, () => {});
})();
})();
</script>
